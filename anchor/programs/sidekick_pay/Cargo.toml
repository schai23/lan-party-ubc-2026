[package]
name = "sidekick_pay"
version = "0.1.0"
description = "Sidekick: per-session USDC escrow paying LAN-party helpers for verified compute"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sidekick_pay"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = { version = "1.2.2", features = ["token", "associated_token"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
